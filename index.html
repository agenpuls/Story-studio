<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d32"><title>Story Studio</title>
<style>
:root{--g:#173d32;--g2:#285b48;--mint:#e8f1eb;--bg:#f6f8f5;--ink:#202a24;--muted:#6d7971;--line:#dfe6e0;--red:#a73d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;background:var(--g);color:white;padding:calc(10px + env(safe-area-inset-top)) 14px 12px}.topin{max-width:900px;margin:auto;display:flex;align-items:center;gap:10px}.logo{background:var(--g2);border-radius:12px;padding:10px;font-size:20px}.brand{flex:1}.brand b{display:block}.brand small{font-size:11px;color:#cbded3}.library{background:#2b5948;border:1px solid #ffffff38;color:white;border-radius:12px;padding:8px 10px;font-size:20px}.library small{display:block;font-size:9px}.wrap{max-width:900px;margin:auto;padding:16px 13px 90px}.intro{margin:5px 0 16px}.eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:800;color:var(--g2)}h1{font-size:24px;line-height:1.2;margin:5px 0}h2{font-size:19px;margin:0 0 8px}h3{font-size:15px;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:13px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.btn{border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink);padding:9px 12px;font-size:13px;font-weight:650}.primary{background:var(--g);color:white;border-color:var(--g)}.soft{background:var(--mint);color:var(--g);border-color:#d1e3d7}.danger{color:var(--red);background:#fffafa;border-color:#efd5d5}.tiny{padding:6px 9px;font-size:11px}.stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stage{border:1px solid var(--line);border-radius:13px;background:white;text-align:left;padding:12px;min-height:88px}.stage.active{background:var(--g);color:white;border-color:var(--g)}.stage small{display:block;font-size:10px;opacity:.75}.stage b{display:block;margin:5px 0}.modes{display:flex;gap:5px;background:#edf1ed;border-radius:12px;padding:4px;margin-bottom:13px}.modes button{flex:1;border:0;background:transparent;padding:10px 5px;border-radius:9px;font-weight:700;font-size:12px;color:#526158}.modes button.active{background:white;color:var(--g)}.field{display:block;margin:12px 0}.field>span{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d6dfd8;border-radius:10px;padding:10px 11px;background:white;color:var(--ink)}textarea{min-height:120px;line-height:1.55;resize:vertical}textarea.long{min-height:240px}textarea.short{min-height:70px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.notice{padding:11px;background:#f6f1e5;border:1px solid #e9dfc4;border-radius:11px;color:#68572e;font-size:12px;line-height:1.5}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.scene{border:1px solid var(--line);border-radius:13px;padding:11px;margin:10px 0;background:#fcfdfb}.scenehead{display:flex;gap:7px;align-items:center;margin-bottom:8px}.scenehead input{min-width:0;flex:1;border:1px solid transparent;background:transparent;padding:7px;border-radius:8px;font-weight:700}.scenehead input:focus{border-color:var(--line);background:white}.tag{font-size:10px;background:var(--mint);color:var(--g);font-weight:800;padding:5px 7px;border-radius:7px}.pill{background:#edf3ef;border-radius:99px;padding:5px 8px;font-size:11px;color:var(--g);font-weight:700}.listitem{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.cover{width:58px;height:78px;flex:none;border-radius:9px;background:linear-gradient(140deg,#244d3e,#9ab5a0);color:white;display:grid;place-items:center;font-size:25px}.grow{flex:1;min-width:0}.empty{text-align:center;padding:25px 10px;color:var(--muted)}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffffff0;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:4}.bottomin{max-width:600px;margin:auto;display:flex;gap:8px}.bottom button{flex:1}.reader{background:white;border:1px solid var(--line);border-radius:16px;padding:clamp(18px,5vw,36px)}.reader h1{font-family:Georgia,serif;font-size:30px}.readhead{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--g2);font-weight:800;margin-top:25px}.readtitle{font:22px Georgia,serif;margin:8px 0}.readtext{white-space:pre-wrap;font:17px/1.85 Georgia,serif;margin-bottom:24px}.toast{position:fixed;z-index:20;bottom:82px;left:50%;transform:translateX(-50%);background:#192d23;color:white;padding:10px 15px;border-radius:30px;font-size:12px;max-width:90%;text-align:center}.stats{display:flex;gap:6px;flex-wrap:wrap}.stats span{font-size:11px;background:#eff3ef;border-radius:7px;padding:5px 7px;color:#5b6960}.char{display:flex;gap:7px;align-items:center;border:1px solid var(--line);padding:7px 9px;border-radius:30px;font-size:12px;margin:3px}.char input{accent-color:var(--g)}details{border:1px solid var(--line);border-radius:11px;padding:10px;margin:12px 0}summary{font-size:13px;font-weight:750;cursor:pointer}
@media(min-width:650px){.stages{grid-template-columns:repeat(4,1fr)}.stage{min-height:108px;padding:14px}.panel{padding:20px}}@media(max-width:390px){.grid2{grid-template-columns:1fr}.btn{padding:8px 9px}}
</style></head><body>
<header class="top"><div class="topin"><div class="logo">✦</div><div class="brand"><b>Story Studio</b><small>Ruang kerja cerita lu</small></div><button class="library" id="listBtn" aria-label="List Novel" title="List Novel">▤<small>LIST NOVEL</small></button></div></header>
<main class="wrap" id="app"></main><div class="bottom" id="bottom"><div class="bottomin"><button class="btn soft" id="saveBtn">✓ Simpan</button><button class="btn primary" id="previewBtn">▤ Preview</button></div></div><div id="toast" class="toast hidden"></div><input id="file" type="file" accept=".json,application/json" class="hidden">
<script>
(()=>{'use strict';
const K='storyStudio_v1_project',ST=[['trigger','Trigger','Pemicu cerita'],['levelup','Level Up','Perkembangan & taruhan'],['climax','Klimaks','Puncak konflik'],['aftermath','Aftermath','Dampak & penutup']];
const id=()=>Math.random().toString(36).slice(2,10),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ep=(i=1)=>({id:id(),title:'Episode '+String(i).padStart(2,'0'),scenes:[{id:id(),title:'Adegan 01',type:'Narasi',text:''}]});
const fresh=t=>({id:id(),title:t||'Novel Baru',genre:'Drama',tone:'Sebagian besar 18+',characters:[],bible:'',continuity:'',updated:Date.now(),stages:Object.fromEntries(ST.map(s=>[s[0],{notes:'',episodes:[ep()]}]))});
let S={novels:[],active:null,stage:'trigger',mode:'manual',page:'editor',episode:null,ai:{scope:'partial',task:'new_scene',mode:'development',brief:'',goal:'',events:'',boundaries:'',ending:'',length:'Sedang (800–1500 kata)',focus:'Emosi dan relasi',sensuality:'Sebagian besar 18+',context:'',notes:'',chars:[]}};
let timer;function say(m){let t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>t.classList.add('hidden'),2200)}
function save(silent=true){try{localStorage.setItem(K,JSON.stringify({novels:S.novels,active:S.active,stage:S.stage}));if(!silent)say('Tersimpan di browser HP ini.')}catch(e){say('Penyimpanan penuh. Ekspor JSON sebagai cadangan.')}}
function N(){return S.novels.find(n=>n.id===S.active)}function D(){return N()?.stages[S.stage]}function E(){let d=D();return d?.episodes.find(e=>e.id===S.episode)||d?.episodes[0]}function words(n){return ST.flatMap(x=>(n.stages[x[0]]?.episodes||[]).flatMap(e=>e.scenes.map(s=>s.text||''))).join(' ').trim().split(/\s+/).filter(Boolean).length}function eps(n){return ST.reduce((a,x)=>a+(n.stages[x[0]]?.episodes.length||0),0)}
function page(p){S.page=p;render()}function novelRow(n){return `<div class="listitem"><div class="cover">✦</div><div class="grow"><h3>${esc(n.title)}</h3><p class="small muted">${esc(n.genre)} · ${eps(n)} episode · ${words(n)} kata</p><div class="row"><button class="btn primary tiny" data-open="${n.id}">Lanjutkan</button><button class="btn tiny" data-read="${n.id}">Baca</button><button class="btn tiny" data-rename="${n.id}">Ubah judul</button></div></div></div>`}
function render(){const app=document.getElementById('app');document.getElementById('bottom').classList.toggle('hidden',['novels','reader'].includes(S.page));if(S.page==='novels'){app.innerHTML=`<div class="intro"><div class="eyebrow">PERPUSTAKAAN</div><h1>List Novel</h1><div class="muted small">Pilih novel untuk dibaca atau dilanjutkan.</div></div><div class="panel"><div class="head"><h2>Rak novel (${S.novels.length})</h2><button class="btn primary" id="create">＋ Novel</button></div>${S.novels.length?S.novels.map(novelRow).join(''):'<div class="empty">Rak masih kosong. Buat novel pertama lu.</div>'}</div><div class="panel"><h3>Cadangan proyek</h3><p class="small muted">Ekspor JSON sebelum pindah perangkat atau membersihkan data browser.</p><div class="row"><button class="btn soft" id="export">⇩ Ekspor proyek</button><button class="btn" id="import">⇧ Impor JSON</button></div></div>`;common();return}
if(S.page==='reader'){let n=N(),items=[];if(n)ST.forEach(st=>(n.stages[st[0]]?.episodes||[]).forEach(e=>{let tx=e.scenes.map(s=>s.text.trim()).filter(Boolean).join('\\n\\n');if(tx)items.push({stage:st[1],title:e.title,text:tx})}));app.innerHTML=`<div class="intro"><div class="eyebrow">MODE BACA</div><h1>${esc(n?.title||'List Novel')}</h1><button class="btn" id="back">← Editor</button></div><article class="reader"><h1>${esc(n?.title||'')}</h1><p class="muted">${esc(n?.genre||'Novel')} · ${words(n||{stages:{}})} kata</p><hr style="border:0;border-top:1px solid #dfe6e0;margin:22px 0">${items.length?items.map(x=>`<div class="readhead">${esc(x.stage)}</div><div class="readtitle">${esc(x.title)}</div><div class="readtext">${esc(x.text)}</div>`).join(''):'<div class="empty">Belum ada teks untuk dibaca. Isi adegan di editor dulu.</div>'}</article>`;common();return}
if(S.page==='characters'){let n=N();app.innerHTML=`<div class="intro"><div class="eyebrow">PENGELOLAAN TOKOH</div><h1>Tokoh</h1><button class="btn" id="back">← Editor</button></div><div class="panel"><div class="head"><h2>Daftar tokoh (${n.characters.length})</h2><button class="btn primary" id="addChar">＋ Tokoh</button></div>${n.characters.map(c=>`<div class="scene"><div class="scenehead"><input data-cn="${c.id}" value="${esc(c.name)}"><button class="btn danger tiny" data-dc="${c.id}">Hapus</button></div><label class="field"><span>Peran / relasi</span><input data-cr="${c.id}" value="${esc(c.role||'')}"></label><label class="field"><span>Kepribadian, tujuan, kondisi</span><textarea class="short" data-cd="${c.id}">${esc(c.description||'')}</textarea></label></div>`).join('')||'<div class="empty">Belum ada tokoh.</div>'}<button class="btn primary" id="saveChars">✓ Simpan Tokoh</button></div>`;common();return}
if(S.page==='bible'){let n=N();app.innerHTML=`<div class="intro"><div class="eyebrow">KANON & KONTINUITAS</div><h1>Story Bible</h1><button class="btn" id="back">← Editor</button></div><div class="panel"><label class="field"><span>Judul novel</span><input id="nt" value="${esc(n.title)}"></label><label class="field"><span>Genre</span><input id="ng" value="${esc(n.genre)}"></label><label class="field"><span>Story Bible — fakta kanon, dunia, relasi</span><textarea class="long" id="bible">${esc(n.bible)}</textarea></label><label class="field"><span>Ringkasan kontinuitas terkini</span><textarea class="long" id="cont">${esc(n.continuity)}</textarea></label><div class="row"><button class="btn primary" id="saveBible">✓ Simpan</button><button class="btn danger" id="delNovel">Hapus novel</button></div></div>`;common();return}
if(!N()){app.innerHTML=`<div class="intro"><div class="eyebrow">MULAI DARI IDE</div><h1>Bangun cerita lu,<br>tahap demi tahap.</h1><div class="muted small">Tulis manual atau siapkan brief pengembangan AI.</div></div><div class="panel"><div class="head"><h2>Proyek novel</h2><span class="pill">${S.novels.length} novel</span></div>${S.novels.map(novelRow).join('')||'<div class="empty">Belum ada novel. Bikin proyek pertama lu.</div>'}<button class="btn primary" style="width:100%" id="create">＋ Buat Novel Baru</button></div><div class="panel"><h3>Alur cerita</h3><div class="stages">${ST.map((x,i)=>`<div class="stage"><small>0${i+1}</small><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div></div><div class="panel"><button class="btn soft" id="import">⇧ Impor JSON</button></div>`;common();return}
let n=N(),d=D(),e=E();S.episode=e?.id||null;
app.innerHTML=`<div class="intro"><div class="eyebrow">PROYEK AKTIF</div><h1>${esc(n.title)}</h1><div class="stats"><span>${esc(n.genre)}</span><span>${eps(n)} episode</span><span>${words(n)} kata</span></div></div>
<div class="panel"><div class="head"><h2>Pilih tahap cerita</h2><button class="btn tiny" id="bibleBtn">▤ Story Bible</button></div><div class="stages">${ST.map((x,i)=>`<button class="stage ${S.stage===x[0]?'active':''}" data-stage="${x[0]}"><small>0${i+1}</small><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div></div>
<div class="panel"><div class="head"><div><div class="eyebrow">${ST.find(x=>x[0]===S.stage)[1].toUpperCase()}</div><h2>Ruang pengembangan</h2></div><button class="btn tiny" id="noteStage">✎ Catatan tahap</button></div>
<div class="modes"><button data-mode="manual" class="${S.mode==='manual'?'active':''}">✎ Manual</button><button data-mode="ai" class="${S.mode==='ai'?'active':''}">✦ Pengembangan AI</button></div>
${S.mode==='manual'?manual(d,e):aiForm(n,d,e)}
</div><div class="panel"><h3>Perangkat cerita</h3><div class="row"><button class="btn soft" id="charsBtn">♙ Tokoh (${n.characters.length})</button><button class="btn" id="bibleBtn2">▤ Story Bible</button><button class="btn" id="export">⇩ Ekspor JSON</button><button class="btn" id="import">⇧ Impor JSON</button></div><p class="small muted">Penyimpanan lokal browser. ChatGPT tidak otomatis membaca memori aplikasi ini.</p></div>`;
common();bindEditor()}
function manual(d,e){return `<div class="field"><span>Episode aktif</span><select id="episodeSelect">${d.episodes.map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><div class="row"><button class="btn soft tiny" id="addEp">＋ Episode</button><button class="btn tiny" id="renameEp">Ubah judul</button><button class="btn danger tiny" id="delEp">Hapus episode</button></div><label class="field"><span>Judul episode (bisa diedit langsung)</span><input id="epTitle" value="${esc(e.title)}"></label><div class="head"><h3>Adegan dalam episode</h3><button class="btn soft tiny" id="addScene">＋ Adegan</button></div>${e.scenes.map(s=>sceneCard(s,true)).join('')}<div class="row"><button class="btn primary" id="saveNow">✓ Simpan sekarang</button><button class="btn" id="readNow">Baca preview</button></div>`}
function sceneCard(s,del){return `<div class="scene"><div class="scenehead"><span class="tag">${esc(s.type||'Narasi')}</span><input data-stitle="${s.id}" value="${esc(s.title)}" aria-label="Judul adegan">${del?`<button class="btn danger tiny" data-dscene="${s.id}">×</button>`:''}</div><select data-type="${s.id}" aria-label="Jenis adegan"><option ${s.type==='Narasi'?'selected':''}>Narasi</option><option ${s.type==='Aksi'?'selected':''}>Aksi</option><option ${s.type==='Dialog'?'selected':''}>Dialog</option><option ${s.type==='POV'?'selected':''}>POV</option></select><textarea data-text="${s.id}" placeholder="Tulis isi adegan di sini...">${esc(s.text)}</textarea></div>`}
function aiForm(n,d,e){let a=S.ai;return `<div class="notice">Paket instruksi dibuat di sini untuk lu salin ke ChatGPT secara manual. Belum ada panggilan AI otomatis/API.</div><div class="field"><span>Cakupan</span><div class="modes"><button data-scope="full" class="${a.scope==='full'?'active':''}">Full tahap</button><button data-scope="partial" class="${a.scope==='partial'?'active':''}">Sebagian / terarah</button></div></div><div class="grid2"><label class="field"><span>Tugas</span><select id="task"><option value="new_scene" ${a.task==='new_scene'?'selected':''}>Buat adegan baru</option><option value="continue_scene" ${a.task==='continue_scene'?'selected':''}>Lanjutkan adegan</option><option value="revise_scene" ${a.task==='revise_scene'?'selected':''}>Revisi adegan terpilih</option></select></label><label class="field"><span>Mode kerja</span><select id="aimode"><option value="obedient" ${a.mode==='obedient'?'selected':''}>Mode patuh</option><option value="development" ${a.mode==='development'?'selected':''}>Mode pengembangan</option><option value="exploration" ${a.mode==='exploration'?'selected':''}>Mode eksplorasi</option></select></label></div><label class="field"><span>Brief / ide dasar</span><textarea id="brief" placeholder="Apa yang terjadi, suasana, konflik, atau arah cerita?">${esc(a.brief)}</textarea></label><div class="grid2"><label class="field"><span>Tujuan adegan</span><textarea class="short" id="goal">${esc(a.goal)}</textarea></label><label class="field"><span>Akhir yang diinginkan</span><textarea class="short" id="ending">${esc(a.ending)}</textarea></label></div><label class="field"><span>Peristiwa wajib ada</span><textarea class="short" id="events">${esc(a.events)}</textarea></label><label class="field"><span>Batasan / fakta yang tidak boleh berubah</span><textarea class="short" id="bounds">${esc(a.boundaries)}</textarea></label><div class="grid2"><label class="field"><span>Panjang target</span><select id="length">${['Pendek (300–600 kata)','Sedang (800–1500 kata)','Panjang (1500–3000 kata)','Sangat panjang (3000+ kata)','Bebas sesuai kebutuhan'].map(x=>`<option ${a.length===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>Fokus</span><select id="focus">${['Emosi dan relasi','Dialog','Aksi dan ketegangan','Narasi dan atmosfer','Psikologi tokoh','Pacing dan struktur','Seimbang'].map(x=>`<option ${a.focus===x?'selected':''}>${x}</option>`).join('')}</select></label></div><label class="field"><span>Nuansa dewasa</span><select id="sens">${['Mulai 18+','Sebagian besar 18+','All 18+'].map(x=>`<option ${a.sensuality===x?'selected':''}>${x}</option>`).join('')}</select><div class="small muted">Untuk nuansa, ketertarikan, emosi, gestur, dan atmosfer dewasa. Tokoh harus dewasa dan interaksi intim konsensual; hindari deskripsi seksual grafis.</div></label><div class="field"><span>Tokoh yang terlibat</span><div class="row">${n.characters.map(c=>`<label class="char"><input type="checkbox" data-achar="${c.id}" ${a.chars.includes(c.id)?'checked':''}>${esc(c.name)}</label>`).join('')||'<span class="small muted">Tambahkan tokoh lewat tombol Tokoh.</span>'}</div></div><details><summary>Konteks cerita & catatan tambahan</summary><label class="field"><span>Ringkasan sebelumnya</span><textarea id="context">${esc(a.context||n.continuity||'')}</textarea></label><label class="field"><span>Catatan tambahan</span><textarea class="short" id="notes">${esc(a.notes)}</textarea></label></details><div class="row"><button class="btn primary" id="makePack">▣ Buat paket JSON</button><button class="btn soft" id="copyPack" disabled>Salin JSON</button><button class="btn" id="downPack" disabled>Unduh JSON</button></div><div id="package" class="hidden"><label class="field"><span>Paket untuk ChatGPT</span><textarea class="long" id="packOut" readonly></textarea></label><div class="notice">Salin JSON ke ChatGPT. Minta hasil hanya untuk cakupan yang dipilih, lalu tempel hasilnya ke bawah.</div><label class="field"><span>Tempel hasil ChatGPT</span><textarea class="long" id="result" placeholder="Tempel teks adegan di sini..."></textarea></label><div class="row"><button class="btn primary" id="applyResult">＋ Masukkan ke adegan</button><button class="btn" id="downResult">⇩ Unduh .txt</button></div></div><div class="head" style="margin-top:17px"><h3>Editor adegan</h3><span class="pill">${esc(e.title)}</span></div><div class="field"><span>Episode tujuan</span><select id="episodeSelect">${d.episodes.map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div>${e.scenes.map(s=>sceneCard(s,false)).join('')}<div class="row"><button class="btn soft" id="addEp">＋ Episode</button><button class="btn soft" id="addScene">＋ Adegan</button><button class="btn" id="saveNow">✓ Simpan</button></div>`}
function bindEditor(){let n=N(),d=D();document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{S.stage=b.dataset.stage;S.episode=null;save();render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;render()});document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{S.ai.scope=b.dataset.scope;render()});
const on=(id,ev,fn)=>{let el=document.getElementById(id);if(el)el.addEventListener(ev,fn)};on('episodeSelect','change',v=>{S.episode=v.target.value;render()});
on('epTitle','input',v=>{let e=E();e.title=v.target.value;save()});
document.querySelectorAll('[data-stitle]').forEach(el=>el.oninput=()=>{let s=E().scenes.find(x=>x.id===el.dataset.stitle);if(s){s.title=el.value;save()}});document.querySelectorAll('[data-text]').forEach(el=>el.oninput=()=>{let s=E().scenes.find(x=>x.id===el.dataset.text);if(s){s.text=el.value;N().updated=Date.now();save()}});document.querySelectorAll('[data-type]').forEach(el=>el.onchange=()=>{let s=E().scenes.find(x=>x.id===el.dataset.type);if(s)s.type=el.value;save();render()});
