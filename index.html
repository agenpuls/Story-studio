<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071321"><title>Story Studio</title>
<style>
:root{--bg:#071321;--panel:#0d2035;--line:#294564;--text:#e8f1ff;--muted:#91a9cc;--blue:#3291ff;--orange:#ff9d20;--green:#12d6ad;--purple:#d36bff;--yellow:#e8c65a;--cyan:#54c9d9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#102744,#07111f 60%);color:var(--text);font:15px/1.45 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;background:#122744;border:1px solid var(--line);border-radius:10px;padding:8px 11px}button:disabled{opacity:.3}.top{position:sticky;top:0;z-index:5;background:#071321ed;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 15px;display:flex;gap:12px;align-items:center}.brand{font-size:20px;font-weight:800;flex:1}.app{max-width:900px;margin:auto;padding:15px 12px 100px}.head{display:flex;gap:12px;align-items:center;background:linear-gradient(120deg,#102844,#0a192b);border:1px solid #2a4d75;border-radius:16px;padding:14px}.logo{font-size:25px;background:#173a6a;border-radius:12px;padding:10px}.grow{flex:1;min-width:0}.title{width:100%;background:transparent;border:0;color:var(--text);font-size:20px;font-weight:800;padding:0}.muted{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.primary{background:#1763bd;border-color:#428de8}.scene{margin:14px 0;border:1px solid #274565;background:#0a192a;border-radius:15px;overflow:hidden}.scenehead{display:flex;align-items:center;gap:8px;padding:12px;background:#0e2035;border-bottom:1px solid #1e3652}.scenehead input{min-width:0;flex:1;background:transparent;border:0;color:var(--text);font-size:17px;font-weight:750}.scenehead .status{color:#f0d56f;border:1px solid #665b35;background:#332d1a;border-radius:20px;padding:3px 8px;font-size:11px}.body{padding:12px}.blocks{display:flex;flex-direction:column;gap:9px}.block{--c:var(--blue);display:flex;align-items:flex-start;gap:9px;padding:10px;border:1px solid var(--c);border-left:4px solid var(--c);border-radius:12px;background:linear-gradient(110deg,color-mix(in srgb,var(--c) 9%,#0b1b2d),#0b192a)}.ico{flex:0 0 32px;height:32px;border-radius:9px;background:color-mix(in srgb,var(--c) 24%,#10243b);color:var(--c);display:grid;place-items:center}.content{flex:1;min-width:0}.kind{color:var(--c);font-weight:800;font-size:13px}.txt{width:100%;resize:vertical;min-height:24px;background:transparent;border:0;color:#d1e2fb;padding:0;line-height:1.5}.tools{display:flex;gap:3px;flex-direction:column}.mini{padding:3px 6px;font-size:12px}.connectors{margin:10px 0 0 4px;display:flex;flex-direction:column;gap:5px}.con{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--c)}.con svg{width:62px;height:18px;flex:none}.count{color:var(--muted)}.scenefoot{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.add{border-style:dashed;background:#0c2036}.collapsed .body{display:none}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;gap:8px;padding:9px 12px;background:#071321ed;border-top:1px solid var(--line);backdrop-filter:blur(10px)}.bottom button{flex:1}.active{background:#153d6b;border-color:var(--blue)}.hint{font-size:12px;color:var(--muted)}.toast{display:none;position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#183452;border:1px solid #3d6690;border-radius:12px;padding:10px 15px;z-index:20}.backdrop{display:none;position:fixed;inset:0;background:#0009;z-index:15;align-items:flex-end;justify-content:center}.modal{background:#0c1c30;border:1px solid #2b4b70;border-radius:18px 18px 0 0;padding:20px;width:min(100%,520px)}.modal label{display:block;margin:10px 0 5px;color:var(--muted)}.modal input,.modal textarea,.modal select{width:100%;padding:10px;border-radius:9px;background:#071525;color:var(--text);border:1px solid var(--line)}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.preview .tools,.preview .scenefoot{display:none}.preview .txt{resize:none}@media(min-width:650px){.app{padding:22px 20px 100px}.body{padding:16px}.backdrop{align-items:center}.modal{border-radius:18px}}@media(max-width:380px){.title{font-size:17px}.head{padding:10px}.scenehead{padding:9px}.block{padding:8px 7px;gap:6px}.ico{flex-basis:27px;height:27px}}
</style></head><body>
<header class="top"><span style="font-size:24px">📖</span><div class="brand">Story Studio</div><button id="export">⇩ TXT</button><button id="more">⋮</button></header>
<main class="app" id="app"><section class="head"><div class="logo">▱</div><div class="grow"><input class="title" id="epTitle" value="Episode 1 — Pertemuan" aria-label="Judul episode"><div class="muted"><span id="counts">2 adegan · 6 blok</span> · Diubah <span id="edited">—</span></div></div><button id="editTitle">✎</button></section>
<div class="toolbar"><button class="primary" id="addScene">＋ Tambah Adegan</button><button id="connect">↔ Garis relasi: ON</button><button id="backup">Backup JSON</button><button id="import">Impor JSON</button></div><div id="scenes"></div><button class="add" id="addBottom" style="width:100%;padding:13px">＋ Tambah adegan baru</button><p class="hint">Edit teks langsung di blok. Gunakan panah untuk mengurutkan blok/adegan. Di desktop, adegan juga bisa diseret. Draft tersimpan otomatis di browser perangkat ini.</p></main>
<nav class="bottom"><button id="editor" class="active">✎ Editor</button><button id="read">▤ Mode Baca</button><button id="new">＋ Adegan</button></nav>
<div class="toast" id="toast"></div><div class="backdrop" id="back"><section class="modal"><h2 id="mtitle">Tambah blok</h2><div id="mcontent"></div><div class="modalactions"><button id="cancel">Batal</button><button class="primary" id="save">Simpan</button></div></section></div><input type="file" id="file" accept=".json,application/json" hidden>
<script>
const K='storyStudioDraft_v2',T={Narasi:['#3291ff','▤'],Aksi:['#ff9d20','🏃'],Dialog:['#12d6ad','●'],Pikiran:['#d36bff','☁'],Catatan:['#e8c65a','▣'],POV:['#54c9d9','◉']};const id=()=>Math.random().toString(36).slice(2,10);let S={title:'Episode 1 — Pertemuan',connectors:true,updated:Date.now(),scenes:[{id:id(),title:'Adegan 1',summary:'Hujan turun di halaman rumah.',status:'Draft',blocks:[{id:id(),type:'Narasi',text:'Hujan turun di halaman rumah.'},{id:id(),type:'Aksi',text:'Rina membuka pintu.'},{id:id(),type:'Dialog',text:'“Kamu datang juga.”'}]},{id:id(),title:'Adegan 2',summary:'Rina memperhatikan tamunya.',status:'Revisi',blocks:[{id:id(),type:'Narasi',text:'Rina memperhatikan tamunya.'},{id:id(),type:'Aksi',text:'Ia menggeser tubuhnya ke samping.'},{id:id(),type:'Dialog',text:'“Masuklah.”'}]}]},preview=false,action=null,drag=null;
const $=x=>document.getElementById(x), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saveState(){S.updated=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}updateMeta()}
function updateMeta(){$('epTitle').value=S.title;$('counts').textContent=S.scenes.length+' adegan · '+S.scenes.reduce((n,s)=>n+s.blocks.length,0)+' blok';$('edited').textContent=new Date(S.updated).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});$('connect').textContent='↔ Garis relasi: '+(S.connectors?'ON':'OFF')}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2200)}
function lines(bs){if(!S.connectors)return '';let n={};bs.forEach(b=>n[b.type]=(n[b.type]||0)+1);return '<div class="connectors">'+Object.keys(T).filter(k=>n[k]>=2).map(k=>{let c=T[k][0];return `<div class="con" style="--c:${c}"><svg viewBox="0 0 62 18"><circle cx="3" cy="3" r="3" fill="${c}"/><path d="M3 3 H21 Q28 3 28 9 V9 Q28 15 35 15 H59" stroke="${c}" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="59" cy="15" r="3" fill="${c}"/></svg><b>${k} ↔ ${k}</b><span class="count">(${n[k]} blok)</span></div>`}).join('')+'</div>'}
function render(){ $('scenes').innerHTML=S.scenes.map((s,i)=>`<section class="scene ${s.collapsed?'collapsed':''}" data-scene="${s.id}" draggable="true"><header class="scenehead"><button data-act="collapse" data-id="${s.id}">${s.collapsed?'▸':'⌄'}</button><input data-field="stitle" data-id="${s.id}" value="${esc(s.title)}" aria-label="Judul adegan"><span class="status">${esc(s.status||'Draft')}</span><button data-act="menu" data-id="${s.id}">⋮</button></header><div class="body"><div class="blocks">${s.blocks.map(b=>`<article class="block" style="--c:${(T[b.type]||T.Narasi)[0]}" data-block="${b.id}"><div class="ico">${(T[b.type]||T.Narasi)[1]}</div><div class="content"><div class="kind">${esc(b.type)}</div><textarea class="txt" data-field="text" data-scene="${s.id}" data-id="${b.id}" rows="${Math.max(1,Math.min(5,Math.ceil((b.text||'').length/50)))}" placeholder="Tulis ${b.type.toLowerCase()}...">${esc(b.text)}</textarea></div><div class="tools"><button class="mini" data-act="bup" data-scene="${s.id}" data-id="${b.id}">↑</button><button class="mini" data-act="bdown" data-scene="${s.id}" data-id="${b.id}">↓</button><button class="mini" data-act="bedit" data-scene="${s.id}" data-id="${b.id}">⋮</button></div></article>`).join('')}</div>${lines(s.blocks)}<div class="scenefoot"><button class="add" data-act="addblock" data-id="${s.id}">＋ Tambah blok</button><button data-act="summary" data-id="${s.id}">✎ Ringkasan</button><button data-act="status" data-id="${s.id}">◷ Status</button><button data-act="sup" data-id="${s.id}" ${i===0?'disabled':''}>↑ Adegan</button><button data-act="sdown" data-id="${s.id}" ${i===S.scenes.length-1?'disabled':''}>↓ Adegan</button></div></div></section>`).join('');$('app').classList.toggle('preview',preview);$('editor').classList.toggle('active',!preview);$('read').classList.toggle('active',preview);updateMeta()}
function addScene(){let s={id:id(),title:'Adegan '+(S.scenes.length+1),summary:'Belum ada ringkasan.',status:'Draft',blocks:[{id:id(),type:'Narasi',text:''}]};S.scenes.push(s);saveState();render();toast('Adegan ditambahkan')}
function modal(title,content,fn){action=fn;$('mtitle').textContent=title;$('mcontent').innerHTML=content;$('back').style.display='flex'}
function close(){ $('back').style.display='none';action=null}
function options(sel){return Object.keys(T).map(t=>`<option ${t===sel?'selected':''}>${t}</option>`).join('')}
function addBlock(sid){modal('Tambah blok',`<label>Jenis blok</label><select id="type">${options('Narasi')}</select><label>Isi</label><textarea id="initial" rows="4" placeholder="Tulis di sini..."></textarea>`,()=>{let s=S.scenes.find(x=>x.id===sid);s.blocks.push({id:id(),type:$('type').value,text:$('initial').value});saveState();render()})}
function editBlock(sid,bid){let s=S.scenes.find(x=>x.id===sid),b=s.blocks.find(x=>x.id===bid);modal('Edit blok',`<label>Jenis</label><select id="type">${options(b.type)}</select><label>Isi</label><textarea id="initial" rows="4">${esc(b.text)}</textarea><button id="delblock" style="color:#ff8798;margin-top:10px">Hapus blok</button>`,()=>{b.type=$('type').value;b.text=$('initial').value;saveState();render()});setTimeout(()=>$('delblock').onclick=()=>{if(confirm('Hapus blok ini?')){s.blocks=s.blocks.filter(x=>x.id!==bid);saveState();close();render()}},0)}
function sceneMenu(sid){let s=S.scenes.find(x=>x.id===sid);modal('Pengaturan adegan',`<label>Status</label><select id="status">${['Draft','Revisi','Siap','Final'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select><label>Ringkasan</label><textarea id="summary" rows="3">${esc(s.summary)}</textarea><button id="duplicate" style="margin-top:10px">▣ Duplikat adegan</button><button id="delete" style="margin-top:10px;color:#ff8798">Hapus adegan</button>`,()=>{s.status=$('status').value;s.summary=$('summary').value;saveState();render()});setTimeout(()=>{$('duplicate').onclick=()=>{let c=JSON.parse(JSON.stringify(s));c.id=id();c.title+=' (salinan)';c.blocks=c.blocks.map(b=>({...b,id:id()}));S.scenes.splice(S.scenes.findIndex(x=>x.id===sid)+1,0,c);saveState();close();render()};$('delete').onclick=()=>{if(S.scenes.length<2){toast('Minimal satu adegan');return}if(confirm('Hapus adegan dan semua bloknya?')){S.scenes=S.scenes.filter(x=>x.id!==sid);saveState();close();render()}}},0)}
function move(a,i,d){let j=i+d;if(j>=0&&j<a.length)[a[i],a[j]]=[a[j],a[i]]}
$('scenes').addEventListener('input',e=>{let x=e.target;if(x.dataset.field==='text'){let s=S.scenes.find(s=>s.id===x.dataset.scene),b=s?.blocks.find(b=>b.id===x.dataset.id);if(b){b.text=x.value;saveState()}}if(x.dataset.field==='stitle'){let s=S.scenes.find(s=>s.id===x.dataset.id);if(s){s.title=x.value;saveState()}}});
$('scenes').addEventListener('change',e=>{let x=e.target;if(x.dataset.field==='text'){let s=S.scenes.find(s=>s.id===x.dataset.scene);if(s){s.summary=(s.blocks.find(b=>b.type==='Narasi'&&b.text.trim())?.text||'Belum ada ringkasan').slice(0,90);render()}}});
$('scenes').addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,idv=b.dataset.id,sid=b.dataset.scene,s=S.scenes.find(s=>s.id===idv);if(a==='collapse'){s.collapsed=!s.collapsed;render()}if(a==='menu')sceneMenu(idv);if(a==='addblock')addBlock(idv);if(a==='bedit')editBlock(sid,idv);if(a==='bup'||a==='bdown'){let sc=S.scenes.find(s=>s.id===sid),i=sc.blocks.findIndex(x=>x.id===idv);move(sc.blocks,i,a==='bup'?-1:1);saveState();render()}if(a==='sup'||a==='sdown'){move(S.scenes,S.scenes.findIndex(x=>x.id===idv),a==='sup'?-1:1);saveState();render()}if(a==='summary')modal('Ringkasan adegan',`<label>Ringkasan</label><textarea id="summary" rows="4">${esc(s.summary)}</textarea>`,()=>{s.summary=$('summary').value;saveState();render()});if(a==='status')modal('Status adegan',`<label>Status</label><select id="status">${['Draft','Revisi','Siap','Final'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select>`,()=>{s.status=$('status').value;saveState();render()})});
$('addScene').onclick=$('addBottom').onclick=$('new').onclick=addScene;$('epTitle').oninput=e=>{S.title=e.target.value;saveState()};$('editTitle').onclick=()=>$('epTitle').focus();$('connect').onclick=()=>{S.connectors=!S.connectors;saveState();render()};$('editor').onclick=()=>{preview=false;render()};$('read').onclick=()=>{preview=true;render()};$('cancel').onclick=close;$('back').onclick=e=>{if(e.target.id==='back')close()};$('save').onclick=()=>{if(action)action();close()};
function download(n,t,type){let u=URL.createObjectURL(new Blob([t],{type})),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function txt(){let o=S.title+'\n\n';S.scenes.forEach(s=>{o+=s.title+' ['+s.status+']\n'+(s.summary||'')+'\n';s.blocks.forEach(b=>o+=b.type+': '+b.text+'\n');o+='\n'});download('story-studio.txt',o,'text/plain;charset=utf-8')}
$('export').onclick=txt;$('backup').onclick=()=>download('story-studio-backup.json',JSON.stringify(S,null,2),'application/json');$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.scenes)||!x.scenes.length)throw 0;S=x;saveState();render();toast('Backup diimpor')}catch(_){toast('File JSON tidak valid')}e.target.value=''};
$('more').onclick=()=>modal('Story Studio',`<p>Draft tersimpan di browser ini.</p><button id="reset">Mulai ulang draft</button>`,()=>{});setTimeout(()=>{if($('reset'))$('reset').onclick=()=>{if(confirm('Hapus draft lokal dan mulai ulang?')){localStorage.removeItem(K);location.reload()}}},0);
let stored;try{stored=JSON.parse(localStorage.getItem(K))}catch(e){}if(stored?.scenes?.length)S=stored;render();
</script></body></html>
